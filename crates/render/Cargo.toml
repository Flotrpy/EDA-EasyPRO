[package]
name = "easypro-render"
description = "WebGL2 renderer for EasyPRO 2D editors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
easypro-core = { path = "../core" }
earcutr.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }
