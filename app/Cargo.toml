[package]
name = "easypro-app"
description = "EasyPRO: free, local-first electronic design in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
easypro-core = { path = "../crates/core" }
easypro-export = { path = "../crates/export" }
easypro-render = { path = "../crates/render" }
easypro-view3d = { path = "../crates/view3d" }
leptos = { version = "0.8", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
] }
